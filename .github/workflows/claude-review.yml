---
name: claude-review

# Claude reading a pull request against REVIEWING.md, and answering a
# comment naming @claude. The checkout, the credential guard, the
# prompt, the review action, the verdict check and the mention job are
# all btclib-org/.github's reusable-claude-review.yml, called at @main
# so a fix there reaches this tree in one landing (issue
# btclib-org/.github#35). What stays here is the trigger, the
# concurrency group, the workflow-level permissions and the paragraph
# this tree adds to the prompt, none of which the callee holds.
#
# What it is here for is the ack of record. Section 11 of the
# organization's standard says the author does not supply their own, and
# this repository has one maintainer -- so without this the only reading
# a pull request can get is the one its author wrote.
#
# Not a required check, and it must not become one. What it produces is a
# review of type COMMENT, an opinion for the author to weigh; a review
# that gated a merge would make a model's judgement a branch rule.
# REPOSITORY.md records which checks a merge waits on.
#
# One calling job reaches both of the callee's jobs, and each of those
# declines the events that are not its own, so the job below carries no
# `if:` of the review's: the switch, the draft check, the closed check
# and the fork check are the callee's. A condition lifted up here would
# take the callee's `mention` job out with the review.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition in reusable-claude-review.yml withheld while it was
    # a draft: the default types do not include it. closed too: the group
    # below is at the workflow level, so a closed run enters it when the
    # run is created, before any job's own `if:` is read, and can cancel
    # a review still holding the group -- what declines the actual review
    # on a closed pull request is the callee's own job-level `if:`
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
# and nowhere else
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here. One key serves both halves of the workflow: a pull_request event
# keys on the pull request's number, so a push supersedes the review it
# overtakes, and every other event keys on github.run_id, which no two
# runs share, so an @claude answer neither cancels one nor is cancelled
# by one. At the workflow level rather than on the job, the placement
# btclib-org/btclib-secp256k1#593 settled
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Permissions are the calling job's to declare and not the callee's to
  # restore: a called workflow's own `permissions:` can only downgrade
  # what its caller granted, and a scope the callee declares that this
  # list leaves off ends the run in `startup_failure` before any step
  # (btclib-org/.github#912). `contents: read` is what the checkout
  # takes, `pull-requests: write` is what posting the review or the
  # reply takes, and `id-token: write` is the OIDC token the action
  # mints during its own startup.
  #
  # secrets: named rather than `inherit`, which hands the callee every
  # secret this repository holds and is what zizmor's secrets-inherit
  # audit flags.
  claude-review:
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write # posting the review, and the reply to a mention
      id-token: write # the OIDC token the action mints at its own startup
    with:
      # what a review of this tree has to know that a review of any
      # other tree does not, landing between the verdict paragraph and
      # the gates instruction
      extra-prompt: |
        What this repository ships is the text that sessions follow:
        commands/btclib-iss.md and commands/btclib-pr.md are the two
        commands, process/btclib-common.md is what they share, and the
        two agents are generic readers of them. A change is judged by
        what a session does differently afterwards, so a rule stated
        without the command that checks it, a sentence copied from the
        standard rather than pointed at, and an agent file restating a
        rule the process already holds are the defects here.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
