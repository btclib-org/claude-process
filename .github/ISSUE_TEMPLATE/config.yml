---
# The new-issue page of this repository. The forms beside this file are
# the kinds of issue this tree takes -- the process text, and what a
# session following it does wrong or cannot do -- and the links below are
# for what has a better address.
#
# Blank issues are off: a question has a form of its own, which is what
# a blank box would otherwise be the only home for.
blank_issues_enabled: false
contact_links:
  # first, because a vulnerability is the one report that must not be
  # filed as an issue at all
  - name: Security vulnerability
    url: https://github.com/btclib-org/claude-process/security/advisories/new
    about: >
      Never a public issue. This opens a private advisory, visible to
      the maintainers alone; the policy on the Security tab, which this
      repository inherits from the organization, gives an email address
      for anyone who would rather not use it.
  - name: The organization standard
    url: https://github.com/btclib-org/.github/issues
    about: >
      A rule of the standard itself, or a difference between two
      repositories, is filed there: it belongs to neither repository.
